
services:
  
  postgres-db:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_USER: dbusername
      POSTGRES_PASSWORD: dbpassword
      POSTGRES_DB: cloud-service-risk-ratings
    ports:
      - "5432:5432" # Expose DB to port 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./create-cloud-service-risk-ratings-db.sql:/docker-entrypoint-initdb.d/create_database.sql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER" ]
      interval: 20s
      timeout: 4s
      retries: 2

  node-api:
    build:
      context: ./node-api
      dockerfile: node-js.Dockerfile
    container_name: node-api
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=dbusername
      - DB_PASSWORD=dbpassword
      - DB_NAME=cloud-service-risk-ratings
      - DB_SCHEMA=cloud_service_risk_ratings
      - PORT=3000
    ports:
      - "3000:3000" # Expose API to port 3000
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ./node-api:/node-api
    working_dir: /app
    command: "npm start" # You can modify this if you're using a custom start script
    restart: unless-stopped


  csv-loader:
    build:
      context: ./csv-loader
      dockerfile: csv-loader.Dockerfile
    container_name: csv-loader
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=dbusername
      - DB_PASSWORD=dbpassword
      - DB_NAME=cloud-service-risk-ratings
      - DB_SCHEMA=cloud_service_risk_ratings
    volumes:
      - ./csv-loader:/csv-loader
      - ./data:/data
    working_dir: /app
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - backend
    command: ["node", "/app/data-loader.js", "/data/cloud_service_risk_ratings.csv"]


volumes:
  postgres-data:

networks:
  backend:
    driver: bridge