<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudRisk.Simulation</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            background-color: #2f3542;  /* Dark grey background */
            color: #f1f2f6;  /* Light grey text */
        }
        .container {
            width: 90%;
            max-width: 1700px;
            background-color: #353b48;  /* Slightly lighter grey for container */
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .variable-pair {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
            padding: 10px;
            background-color: #2c3039;  /* Darker grey for pairs */
            border-radius: 5px;
        }
        .variable-pair label {
            flex: 1;
            font-weight: 500;
            color: #74b9ff;  /* Light blue for labels */
        }
        select, input {
            flex: 2;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #57606f;
            border-radius: 4px;
            background-color: #2c3039;
            color: #f1f2f6;
            transition: all 0.2s ease;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #74b9ff;
            box-shadow: 0 0 0 2px rgba(116, 185, 255, 0.2);
        }
        #result {
            margin-top: 20px;
            font-weight: 500;
        }
        .controls {
            margin: 15px 0;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #74b9ff;
            color: #2c3039;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        button:hover {
            background-color: #0984e3;
            transform: translateY(-1px);
        }
        h1, h2 {
            color: #74b9ff;  /* Light blue headers */
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        table {
            background-color: #353b48;
        }
        th {
            background-color: #2c3039;
            color: #74b9ff;
            padding: 12px;
            font-weight: 600;
        }
        td {
            padding: 10px;
            border: 1px solid #57606f;
            color: #f1f2f6;
        }
        a {
            color: #ffffff;  /* Changed from #74b9ff to white */
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: #e2e2e2;  /* Light grey on hover */
            text-decoration: underline;  /* Added underline on hover */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Company Details</h1>
    <!-- Input fields for Company Name and Project Name -->
    <div>
        <label for="companyName">Company Name (required):</label>
        <input type="text" id="companyName" required>
    </div>
    <div>
        <label for="projectName">Submission Project Name (optional):</label>
        <input type="text" id="projectName" placeholder="Defaults to Company Name if blank">
    </div>

    <h2>Measure your Cloud.Risk via inserting Cloud Vendor and Service pairs </h2>

    <!-- Buttons to add or remove pairs -->
    <div class="controls">
        <button onclick="addVariablePair()">+</button>
        <button onclick="removeVariablePair()">-</button>
    </div>

    <!-- Container to hold dynamically generated variable pairs -->
    <div id="variableContainer"></div>

</div>

<div class="container">
     <h2>Cloud.Risk</h2>


    <!-- Button to Submit Selected Values -->
    <button onclick="submitData()">Submit Data</button>

    <!-- Div to Display Submission Result -->
    <div id="result"></div>

    <!-- Link to Authorized users to see detailed results of your submission - Cloud.Risk.Graph your Measured Cloud.Risk RATIO -->
    <a href="https://workspace-preview.neo4j.io/workspace/query?ntid=google-oauth2%7C100793316574048247943">'Cloud.Risk.Graph - Measured Cloud.Risk RATIO for Cloud and Service pairs'</a>


    
</div>

<script>
    // Different options for each variable - Cloud and its Services

    const optionsForVariable1 = ["aws", "gcp", "azure", "ibm", "oci", "snowflake", "salesforce", "mongodb", "cloudflare", "akamai"];
    const optionsForVariable2 = ["AWS Lambda", "Google Cloud BigQuery", "PowerBi App", "Storage Accounts", "Snowflake on AWS" , "Snowflake on GCP", "Snowflake on Azure" ,"Salesforce SaaS", "AutonomousDB21C", "OCI AutonomousDB21C",
     "MongoDb Atlas", "Google Cloud Spanner", "Google Cloud SQL", "Google Cloud Bigtable", "Google Cloud Memorystore", "Google Cloud Filestore", "Google Cloud Bigtable", 
     "Google Cloud Memorystore", "Google Cloud Filestore", "AWS Aurora", "AWS RDS", "AWS ElastiCache", "AWS ElasticTranscoder",
      "AWS CloudSearch", "AWS CloudFormation", "AWS CloudWatch", "AWS CloudTrail", "AWS CloudSearch", "AWS CloudFormation", "AWS CloudWatch", "AWS CloudTrail",
    "Databricks", "AWS Redshift", "AWS ElasticTranscoder", "AWS CloudSearch", "AWS CloudFormation", "AWS CloudWatch", "AWS CloudTrail", "AWS CloudSearch", 
    "AWS CloudFormation", "AWS CloudWatch", "AWS CloudTrail", "Databricks", "AWS Elastic MapReduce", "AWS Elastic MapReduce Serverless"];


    // Variables to track number of pairs
    let pairCount = 4; // start with 4 pairs
    const maxPairs = 85;

    // Function to create dropdown options for a given array of options
    function createDropdownOptions(options) {
        return options.map(option => `<option value="${option}">${option}</option>`).join("");
    }

    // Generate dropdown options
    const dropdownOptions1 = createDropdownOptions(optionsForVariable1);
    const dropdownOptions2 = createDropdownOptions(optionsForVariable2);

    // Function to add a variable pair
    function addVariablePair() {
        if (pairCount < maxPairs) {
            pairCount++;
            renderVariablePair(pairCount);
        } else {
            alert("Maximum number of pairs reached.");
        }
    }

    // Function to remove the last variable pair
    function removeVariablePair() {
        if (pairCount > 1) {
            document.getElementById(`variablePair_${pairCount}`).remove();
            pairCount--;
        } else {
            alert("Cannot have less than 1 pair.");
        }
    }

    // Function to render a variable pair
    function renderVariablePair(pairNumber) {
        const container = document.getElementById("variableContainer");

        // Create a div to hold each pair of variables
        const variablePairDiv = document.createElement("div");
        variablePairDiv.className = "variable-pair";
        variablePairDiv.id = `variablePair_${pairNumber}`;

        // Create label and dropdown for variable 1
        variablePairDiv.innerHTML += `
            <label for="variable1_${pairNumber}">Pair ${pairNumber} - Variable 1:</label>
            <select id="variable1_${pairNumber}">
                <option value="">Select an option</option>
                ${dropdownOptions1}
            </select>
        `;

        // Create label and dropdown for variable 2
        variablePairDiv.innerHTML += `
            <label for="variable2_${pairNumber}">Pair ${pairNumber} - Variable 2:</label>
            <select id="variable2_${pairNumber}">
                <option value="">Select an option</option>
                ${dropdownOptions2}
            </select>
        `;

        // Append the pair to the container
        container.appendChild(variablePairDiv);
    }

    // Initialize with 4 variable pairs
    function initializeVariablePairs() {
        for (let i = 1; i <= pairCount; i++) {
            renderVariablePair(i);
        }
    }

    // Function to gather selected values and submit as JSON
    async function submitData() {
        // Get values of Company Name and Project Name
        const companyName = document.getElementById("companyName").value.trim();
        const projectName = document.getElementById("projectName").value.trim() || companyName;

        // Ensure Company Name is provided
        if (!companyName) {
            alert("Company Name is required.");
            return;
        }

        const data = {
            companyName: companyName,
            projectName: projectName,
            variablePairs: []
        };

        // Create table structure
        let tableHTML = `
            <table border="1" style="margin-top: 20px; width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th>Cloud Service</th>
                        <th>SLA Usage %</th>
                        <th>Traffic Coef %</th>
                        <th>SLA Deviation Risk Rating</th>
                        <th>Usage Risk Rating</th>
                        <th>Outage Time</th>
                        <th>Outage Remarks with GenAI</th>
                    </tr>
                </thead>
                <tbody>`;

        // Add explanation section
        const explanationHTML = `
            <div style="margin-top: 20px; padding: 15px; background-color: #2c3039; border-radius: 5px;">
                <h3 style="color: #74b9ff; margin-bottom: 10px;">Understanding the Risk Ratings:</h3>
                <ul style="list-style-type: none; padding-left: 0;">
                    <li style="margin-bottom: 8px;"><strong style="color: #74b9ff;">SLA Usage %:</strong> Measures the percentage of time the service is expected to be available based on the SLA</li>
                    <li style="margin-bottom: 8px;"><strong style="color: #74b9ff;">Traffic Coef %:</strong> Measures the percentage of time the service is expected to be available based on the SLA</li>
                    <li style="margin-bottom: 8px;"><strong style="color: #74b9ff;">SLA Deviation Risk Rating:</strong> Measures the likelihood of service level agreement deviations (0-0.999, where higher values indicate greater risk)</li>
                    <li style="margin-bottom: 8px;"><strong style="color: #74b9ff;">Usage Risk Rating:</strong> Indicates the operational risk based on service usage patterns (0-0.999, where higher values indicate greater risk)</li>
                    <li style="margin-bottom: 8px;"><strong style="color: #74b9ff;">Outage Remarks:</strong> AI-generated insights about potential service disruptions and historical performance</li>
                </ul>
            </div>`;

        // Loop through each pair and gather selected values
        for (let i = 1; i <= pairCount; i++) {
            const variable1 = document.getElementById(`variable1_${i}`).value;
            const variable2 = document.getElementById(`variable2_${i}`).value;

            if (variable1 && variable2) {
                data.variablePairs.push({
                    pair: i,
                    variable1: variable1,
                    variable2: variable2
                });

                try {
                    const response = await fetch(
                       // `https://CloudRiskAPI.InsureYourTech.Cloud/cloud-services-risk-ratings/risk-ratings-freemium/freemium/fetch/service/service_name/${variable2}`,
                       `http://localhost:8000/cloud-services-risk-ratings/risk-ratings-freemium/freemium/fetch/service/service_name/${variable2}`,
                        {
                            method: 'GET',
                            headers: {
                                'Accept': 'application/json',
                                'Content-Type': 'application/json',
                            },
                            mode: 'cors',
                            credentials: 'same-origin',
                        }
                    );

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const riskData = await response.json();
                    
                    tableHTML += `
                        <tr>
                            <td>${variable2}</td>
                            <td>${riskData.service_sla_usage_percentage || 'N/A'}</td>
                            <td>${riskData.service_traffic_coef_by_percent_down || 'N/A'}</td>
                            <td>${riskData.sla_deviation_connected_risk_0_999|| 'N/A'}</td>
                            <td>${riskData.usage_connected_risk_0_999 || 'N/A'}</td>
                            <td>${riskData.annual_outage_time_days_hours_mins || 'N/A'}</td>
                            <td>${riskData.remarks_outage_genai || 'No details available'}</td>
                        </tr>`;
                } catch (error) {
                    console.error(`Error fetching data for ${variable2}:`, error);
                    tableHTML += `
                        <tr>
                            <td>${variable2}</td>
                            <td colspan="2">Error: ${error.message || 'Failed to fetch data'}</td>
                        </tr>`;
                }
            }
        }

        tableHTML += `
                </tbody>
            </table>`;

        // Display the results table
        document.getElementById("result").innerHTML = `
            <h3>Cloud.Risk Results:</h3>
            ${tableHTML}
            ${explanationHTML}`;
    }

    // Initialize the variable pairs on page load
    window.onload = initializeVariablePairs;
</script>

</body>
</html>
