<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudRisk.Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .container {
            width: 90%;
            max-width: 1300px;
        }
        .variable-pair {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
        }
        .variable-pair label {
            flex: 1;
            font-weight: bold;
        }
        select {
            flex: 2;
            padding: 5px;
            font-size: 14px;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
        .controls {
            margin: 10px 0;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Company Details</h1>
    <!-- Input fields for Company Name and Project Name -->
    <div>
        <label for="companyName">Company Name (required):</label>
        <input type="text" id="companyName" required>
    </div>
    <div>
        <label for="projectName">Submission Project Name (optional):</label>
        <input type="text" id="projectName" placeholder="Defaults to Company Name if blank">
    </div>

    <h2>Measure your Cloud.Risk via inserting Cloud Vendor and Service pairs </h2>

    <!-- Buttons to add or remove pairs -->
    <div class="controls">
        <button onclick="addVariablePair()">+</button>
        <button onclick="removeVariablePair()">-</button>
    </div>

    <!-- Container to hold dynamically generated variable pairs -->
    <div id="variableContainer"></div>

    <!-- Button to Submit Selected Values -->
    <button onclick="submitData()">Submit Data</button>

    <!-- Div to Display Submission Result -->
    <div id="result"></div>

    <!-- Link to Authorized users to see detailed results of your submission - Cloud.Risk.Graph your Measured Cloud.Risk RATIO -->
    <a href="https://workspace-preview.neo4j.io/workspace/query?ntid=google-oauth2%7C100793316574048247943">'Cloud.Risk.Graph your Measured Cloud.Risk RATIO for Cloud Vendor and Service pairs'</a>

</div>

<script>
    // Different options for each variable - Cloud and its Services

    const optionsForVariable1 = ["aws", "gcp", "azure", "ibm", "oci", "snowflake", "salesforce", "mongodb", "cloudflare", "akamai"];
    const optionsForVariable2 = ["AWS Lambda", "Google Cloud BigQuery", "PowerBI APP", "Snowflake" ,"Salesforce", "AutonomousDB21C", "OCI AutonomousDB21C",
     "MongoDb Atlas", "Google Cloud Spanner", "Google Cloud SQL", "Google Cloud Bigtable", "Google Cloud Memorystore", "Google Cloud Filestore", "Google Cloud Bigtable", 
     "Google Cloud Memorystore", "Google Cloud Filestore", "AWS Aurora", "AWS RDS", "AWS ElastiCache", "AWS ElasticTranscoder",
      "AWS CloudSearch", "AWS CloudFormation", "AWS CloudWatch", "AWS CloudTrail", "AWS CloudSearch", "AWS CloudFormation", "AWS CloudWatch", "AWS CloudTrail",
    "Databricks", "AWS Redshift", "AWS ElasticTranscoder", "AWS CloudSearch", "AWS CloudFormation", "AWS CloudWatch", "AWS CloudTrail", "AWS CloudSearch", "AWS CloudFormation", "AWS CloudWatch", "AWS CloudTrail",
    "Databricks", "AWS Elastic MapReduce", "AWS Elastic MapReduce Serverless"];


    // Variables to track number of pairs
    let pairCount = 4; // start with 4 pairs
    const maxPairs = 85;

    // Function to create dropdown options for a given array of options
    function createDropdownOptions(options) {
        return options.map(option => `<option value="${option}">${option}</option>`).join("");
    }

    // Generate dropdown options
    const dropdownOptions1 = createDropdownOptions(optionsForVariable1);
    const dropdownOptions2 = createDropdownOptions(optionsForVariable2);

    // Function to add a variable pair
    function addVariablePair() {
        if (pairCount < maxPairs) {
            pairCount++;
            renderVariablePair(pairCount);
        } else {
            alert("Maximum number of pairs reached.");
        }
    }

    // Function to remove the last variable pair
    function removeVariablePair() {
        if (pairCount > 1) {
            document.getElementById(`variablePair_${pairCount}`).remove();
            pairCount--;
        } else {
            alert("Cannot have less than 1 pair.");
        }
    }

    // Function to render a variable pair
    function renderVariablePair(pairNumber) {
        const container = document.getElementById("variableContainer");

        // Create a div to hold each pair of variables
        const variablePairDiv = document.createElement("div");
        variablePairDiv.className = "variable-pair";
        variablePairDiv.id = `variablePair_${pairNumber}`;

        // Create label and dropdown for variable 1
        variablePairDiv.innerHTML += `
            <label for="variable1_${pairNumber}">Pair ${pairNumber} - Variable 1:</label>
            <select id="variable1_${pairNumber}">
                <option value="">Select an option</option>
                ${dropdownOptions1}
            </select>
        `;

        // Create label and dropdown for variable 2
        variablePairDiv.innerHTML += `
            <label for="variable2_${pairNumber}">Pair ${pairNumber} - Variable 2:</label>
            <select id="variable2_${pairNumber}">
                <option value="">Select an option</option>
                ${dropdownOptions2}
            </select>
        `;

        // Append the pair to the container
        container.appendChild(variablePairDiv);
    }

    // Initialize with 4 variable pairs
    function initializeVariablePairs() {
        for (let i = 1; i <= pairCount; i++) {
            renderVariablePair(i);
        }
    }

    // Function to gather selected values and submit as JSON
    async function submitData() {
        // Get values of Company Name and Project Name
        const companyName = document.getElementById("companyName").value.trim();
        const projectName = document.getElementById("projectName").value.trim() || companyName;

        // Ensure Company Name is provided
        if (!companyName) {
            alert("Company Name is required.");
            return;
        }

        const data = {
            companyName: companyName,
            projectName: projectName,
            variablePairs: []
        };

        // Create table structure
        let tableHTML = `
            <table border="1" style="margin-top: 20px; width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th>Cloud Service</th>
                        <th>Risk Rating</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody>`;

        // Loop through each pair and gather selected values
        for (let i = 1; i <= pairCount; i++) {
            const variable1 = document.getElementById(`variable1_${i}`).value;
            const variable2 = document.getElementById(`variable2_${i}`).value;

            // Only process pairs where both variables are selected
            if (variable1 && variable2) {
                data.variablePairs.push({
                    pair: i,
                    variable1: variable1,
                    variable2: variable2
                });

                try {
                    const response = await fetch(
                        `http://localhost:8000/cloud-services-risk-ratings/risk-ratings-freemium/freemium/fetch/service/service_name/${variable2}`,
                        {
                            method: 'GET',
                            headers: {
                                'Accept': 'application/json',
                                'Content-Type': 'application/json'
                            },
                            mode: 'cors' // Enable CORS for cross-origin requests
                        }
                    );
                    const riskData = await response.json();
                    
                    // Add row to table
                    tableHTML += `
                        <tr>
                            <td>${variable2}</td>
                            <td>${riskData.riskRating || 'N/A'}</td>
                            <td>${riskData.details || 'No details available'}</td>
                        </tr>`;
                } catch (error) {
                    console.error(`Error fetching data for ${variable2}:`, error);
                    tableHTML += `
                        <tr>
                            <td>${variable2}</td>
                            <td colspan="2">Error fetching data</td>
                        </tr>`;
                }
            }
        }

        tableHTML += `
                </tbody>
            </table>`;

        // Display the results table
        document.getElementById("result").innerHTML = `
            <h3>Cloud.Risk Results:</h3>
            ${tableHTML}`;
    }

    // Initialize the variable pairs on page load
    window.onload = initializeVariablePairs;
</script>

</body>
</html>
