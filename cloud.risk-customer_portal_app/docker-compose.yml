services:

  customer_portal_app:
    build:
      context: .
      dockerfile: CustomerPortal_app.Dockerfile
    env_file:
      - .env
    environment:
      - NEO4J_CLIENT_URI=${NEO4J_CLIENT_URI-bolt://host.docker.internal:17687}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD-password}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
    networks:
      - cloud-services-risk-ratings-api_backend # backend
    depends_on:
      - customer_graph
    x-develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - readme.md
    extra_hosts:
      - "host.docker.internal:host-gateway" #"host.docker.internal:172.17.0.1"
    ports:
      - 8185:8185
    volumes:
      - ./neo4j_customer_submission:/app/neo4j_customer_submission

  customer_graph:
    image: neo4j:5.25.1-community
    ports:
      - 17474:7474
      - 17473:7473
      - 17687:7687 
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_customer_submission:/var/lib/neo4j/import
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME-neo4j}/${NEO4J_PASSWORD-password}
    networks:
      - cloud-services-risk-ratings-api_backend # backend

  cloud-risk-portal:
    build:
      context: ./cloud-risk-portal
      dockerfile: cloud-risk-portal.Dockerfile
    container_name: cloud-risk-portal
    environment:
      - NEO4J_CLIENT_URI=bolt://host.docker.internal:17687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - PORT=8184
    ports:
      - 8184:8184 # Expose API to port 8183
    depends_on:
      - customer_graph
    volumes:
      - ./cloud-risk-portal:/cloud-risk-portal
    working_dir: /app
    networks:
      - cloud-services-risk-ratings-api_backend # backend
    command: "npm start" # You can modify this if you're using a custom start script
    restart: unless-stopped

networks:
  cloud-services-risk-ratings-api_backend: # backend
    external: true