services:

  customer_portal_app:
    build:
      dockerfile: CustomerPortal_app.Dockerfile
    environment:
      - NEO4J_URI=${NEO4J_URI-neo4j://0.0.0.0:17687}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD-password}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
    networks:
      - cloud-services-risk-ratings-api_backend # backend
    depends_on:
      - customer.risk.graph.neo4j
    x-develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - readme.md
    ports:
      - 8504:8504
    volumes:
      - ./neo4j_customer_submission:/app/neo4j_customer_submission

  customer.risk.graph.neo4j:
    image: neo4j:5.25.1-community
    ports:
      - 17474:7474
      - 17473:7473
      - 17687:7687 
    volumes:
      - ./neo4j_customer_submission:/var/lib/neo4j/import
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME-neo4j}/${NEO4J_PASSWORD-password}
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_server_bolt_advertised__address=customer.risk.graph.neo4j:7687
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687


networks:
  cloud-services-risk-ratings-api_backend: # backend
    external: true