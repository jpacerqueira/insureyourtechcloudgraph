services:

  customer_portal_app:
    build:
      dockerfile: CustomerPortal_app.Dockerfile
    environment:
      - NEO4J_URI=${NEO4J_URI-neo4j://database:7687}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD-password}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
    networks:
      - cloud-services-risk-ratings-api_backend # backend
    x-develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - readme.md
    ports:
      - 8504:8504

networks:
  cloud-services-risk-ratings-api_backend: # backend
    external: true