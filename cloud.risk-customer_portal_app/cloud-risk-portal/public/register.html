<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- Add these new font and icon libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=http://insureyourtech.cloud&size=18">
    <script>
        // Initialize ENV with default values
        window.ENV = window.ENV || {
            apiBaseUrl: 'https://api-cloud-risk.localhost', // #DEV fallback # nginx.conf     
            //apiBaseUrl: 'https://api-cloud-risk.insureyourtech.cloud', // #PROD fallback # nginx.conf
            appBaseUrl: 'https://customer-cloud-risk.localhost', // #DEV fallback # nginx.conf
            //appBaseUrl: 'https://customer-cloud-risk.insureyourtech.cloud', // #PROD fallback # nginx.conf
            isDevelopment: true, // Add development flag # DEV
            //isDevelopment: false, // Add development flag # PROD 
            //isSSLBypassed: true // Add SSL bypass flag
            isSSLBypassed: false // Add SSL bypass flag
        };
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px auto;
            padding: 0 15px;
            background-color: #2f3542;  
            color: #f1f2f6;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            background-color: #353b48;  
            padding: 1rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin: 0 auto 20px;
        }
        .variable-pair {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin: 15px 0;
            padding: 15px;
            background-color: #2c3039;
            border-radius: 5px;
        }
        .variable-pair label {
            flex: none;
            margin-bottom: 8px;
            font-weight: 500;
            color: #74b9ff;
            text-align: left;
        }
        select, input {
            width: 100%;
            max-width: none;
            margin-bottom: 8px;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #57606f;
            border-radius: 4px;
            background-color: #2c3039;
            color: #f1f2f6;
            transition: all 0.2s ease;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #74b9ff;
            box-shadow: 0 0 0 2px rgba(116, 185, 255, 0.2);
        }
        #result {
            margin-top: 20px;
            font-weight: 500;
        }
        .controls {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background-color: #74b9ff;
            color: #2c3039;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            min-width: 44px;
            min-height: 44px;
        }
        button:hover {
            background-color: #0984e3;
            transform: translateY(-1px);
        }
        h1, h2 {
            color: #74b9ff;  /* Light blue headers */
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        table {
            background-color: #353b48;
        }
        th {
            background-color: #2c3039;
            color: #74b9ff;
            padding: 12px;
            font-weight: 600;
        }
        td {
            padding: 10px;
            border: 1px solid #57606f;
            color: #f1f2f6;
        }
        a {
            color: #ffffff; 
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: #e2e2e2; 
            text-decoration: underline; 
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin: 15px 0;
        }

        .metric {
            background-color: #2c3039;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .metric h4 {
            color: #74b9ff;
            margin: 0 0 10px 0;
        }

        .metric .value {
            font-size: 1.2em;
            font-weight: 500;
        }

        .vendor-section {
            margin: 30px 0;
            padding: 20px;
            background-color: #2c3039;
            border-radius: 5px;
        }

        .metric .ai-analysis-content {
            max-height: 20px;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            position: relative;
            margin-top: 10px;
        }

        .metric .ai-analysis-content.expanded {
            max-height: 1000px; 
        }

        .expand-button {
            background: none;
            border: none;
            color: #74b9ff;
            cursor: pointer;
            padding: 5px;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .expand-button:hover {
            color: #0984e3;
            transform: none;
            background: none;
        }

        @media (min-width: 768px) {
            .container {
                padding: 2rem;
            }

            .variable-pair {
                flex-direction: row;
                align-items: center;
                gap: 15px;
            }

            .variable-pair label {
                flex: 0.5;
                margin-bottom: 0;
                text-align: right;
            }

            select, input {
                flex: 1;
                max-width: 300px;
                margin-bottom: 0;
            }

            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .metrics-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        canvas {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Register</h1>
    <form id="registerForm" action="/customer-portal/register" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="customername">Customer Name:</label>
        <input type="text" id="customername" name="customername" required>
        <br>
        <label for="company">Company Name:</label>
        <input type="text" id="company" name="company" required>
        <br>
        <label for="country">Country:</label>
        <select id="country" name="country" required>
            <option value="">Select a Country</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="UK">United Kingdom</option>
            <option value="DE">Germany</option>
            <option value="FR">France</option>
            <option value="ES">Spain</option>
            <option value="IT">Italy</option>
            <option value="NL">Netherlands</option>
            <option value="BE">Belgium</option>
            <option value="CH">Switzerland</option>
            <option value="AT">Austria</option>
            <option value="DK">Denmark</option>
            <option value="NO">Norway</option>
            <option value="SE">Sweden</option>
            <option value="FI">Finland</option>
            <option value="IS">Iceland</option>
            <option value="LI">Liechtenstein</option>
            <option value="MC">Monaco</option>
            <option value="SM">San Marino</option>
            <option value="VA">Vatican City</option>
            <option value="PT">Portugal</option>
            <option value="ZZ">Other</option>
            <!-- Add more countries as needed -->
        </select>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <label for="customer_type">Customer Type:</label>
        <select id="customer_type" name="customer_type" required>
            <option value="premium">premium</option>
            <option value="freemium">freemium</option>
        </select>
        <br>
        <button type="submit">Register</button>
    </form>
    <p>Note: Freemium/Premium are both free until 25th February. After this date, Premium will have a charge of $12, £10, or €11. Freemium will continue free, with reduced functionality.</p>
    <p>Already have an account? <a href="/customer-portal/login">Login here</a></p>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (username !== email) {
                alert('Username and Email must match.');
                event.preventDefault();
                return;
            }

            if (!emailPattern.test(email)) {
                alert('Please enter a valid email address.');
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
