<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="icon" type="image/x-icon" href="https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=http://insureyourtech.cloud&size=18">
    <style>
        /* Reuse styles from login.html */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            background-color: #2f3542;
            color: #f1f2f6;
        }
        .container {
            width: 90%;
            max-width: 2200px;
            background-color: #353b48;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        input, button {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #57606f;
            border-radius: 4px;
            background-color: #2c3039;
            color: #f1f2f6;
            transition: all 0.2s ease;
        }
        button {
            background-color: #74b9ff;
            color: #2c3039;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        button:hover {
            background-color: #0984e3;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <h1>Reset Password</h1>
    <form action="/customer-portal/reset-password" method="POST">
        <label for="email">Enter your email address:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <button type="submit">Send Reset Link</button>
    </form>
</body>
</html>
