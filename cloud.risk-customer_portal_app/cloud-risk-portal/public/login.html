<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/x-icon" href="https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=http://insureyourtech.cloud&size=18">
    <script>
        // Initialize ENV with default values
        window.ENV = window.ENV || {
            apiBaseUrl: 'https://api-cloud-risk.localhost', // #DEV fallback # nginx.conf     
            //apiBaseUrl: 'https://api-cloud-risk.insureyourtech.cloud', // #PROD fallback # nginx.conf
            appBaseUrl: 'https://customer-cloud-risk.localhost', // #DEV fallback # nginx.conf
            //appBaseUrl: 'https://customer-cloud-risk.insureyourtech.cloud', // #PROD fallback # nginx.conf
            isDevelopment: true, // Add development flag # DEV
            //isDevelopment: false, // Add development flag # PROD 
            //isSSLBypassed: true // Add SSL bypass flag
            isSSLBypassed: false // Add SSL bypass flag
        };
    </script>
    <style>
        /* Copy all the CSS from CloudRisk.Simulation.html */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            background-color: #2f3542;  /* Dark grey background */
            color: #f1f2f6;  /* Light grey text */
        }
        .container {
            width: 90%;
            max-width: 2200px;
            background-color: #353b48;  /* Slightly lighter grey for container */
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .variable-pair {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
            padding: 10px;
            background-color: #2c3039;  /* Darker grey for pairs */
            border-radius: 5px;
        }
        .variable-pair label {
            flex: 1;
            font-weight: 500;
            color: #74b9ff;  /* Light blue for labels */
        }
        select, input {
            flex: 2;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #57606f;
            border-radius: 4px;
            background-color: #2c3039;
            color: #f1f2f6;
            transition: all 0.2s ease;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #74b9ff;
            box-shadow: 0 0 0 2px rgba(116, 185, 255, 0.2);
        }
        #result {
            margin-top: 20px;
            font-weight: 500;
        }
        .controls {
            margin: 15px 0;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #74b9ff;
            color: #2c3039;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        button:hover {
            background-color: #0984e3;
            transform: translateY(-1px);
        }
        h1, h2 {
            color: #74b9ff;  /* Light blue headers */
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        table {
            background-color: #353b48;
        }
        th {
            background-color: #2c3039;
            color: #74b9ff;
            padding: 12px;
            font-weight: 600;
        }
        td {
            padding: 10px;
            border: 1px solid #57606f;
            color: #f1f2f6;
        }
        a {
            color: #ffffff;  /* Changed from #74b9ff to white */
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: #e2e2e2;  /* Light grey on hover */
            text-decoration: underline;  /* Added underline on hover */
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 20px 0;
        }

        .metric {
            background-color: #2c3039;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .metric h4 {
            color: #74b9ff;
            margin: 0 0 10px 0;
        }

        .metric .value {
            font-size: 1.2em;
            font-weight: 500;
        }

        .vendor-section {
            margin: 30px 0;
            padding: 20px;
            background-color: #2c3039;
            border-radius: 5px;
        }

        .metric .ai-analysis-content {
            max-height: 20px;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            position: relative;
            margin-top: 10px;
        }

        .metric .ai-analysis-content.expanded {
            max-height: 1000px; /* or any height that would accommodate your content */
        }

        .expand-button {
            background: none;
            border: none;
            color: #74b9ff;
            cursor: pointer;
            padding: 5px;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .expand-button:hover {
            color: #0984e3;
            transform: none;
            background: none;
        }

        .status-indicator {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .status-indicator.healthy {
            background-color: #2ecc71;
            color: white;
        }
        
        .status-indicator.at-risk {
            background-color: #e74c3c;
            color: white;
        }
        
        #outageTable td {
            padding: 8px;
            text-align: left;
        }

        .parallel-charts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 20px 0;
        }

        .service-charts {
            background-color: #2c3039;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Login</h1>
    <form action="/customer-portal/login" method="POST">
        <label for="username">Username/Email:</label>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="/customer-portal/register">Register here</a></p>
</body>
</html>
