<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudRisk.Simulation</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            background-color: #2f3542;  /* Dark grey background */
            color: #f1f2f6;  /* Light grey text */
        }
        .container {
            width: 90%;
            max-width: 1900px;
            background-color: #353b48;  /* Slightly lighter grey for container */
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .variable-pair {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
            padding: 10px;
            background-color: #2c3039;  /* Darker grey for pairs */
            border-radius: 5px;
        }
        .variable-pair label {
            flex: 1;
            font-weight: 500;
            color: #74b9ff;  /* Light blue for labels */
        }
        select, input {
            flex: 2;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #57606f;
            border-radius: 4px;
            background-color: #2c3039;
            color: #f1f2f6;
            transition: all 0.2s ease;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #74b9ff;
            box-shadow: 0 0 0 2px rgba(116, 185, 255, 0.2);
        }
        #result {
            margin-top: 20px;
            font-weight: 500;
        }
        .controls {
            margin: 15px 0;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #74b9ff;
            color: #2c3039;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        button:hover {
            background-color: #0984e3;
            transform: translateY(-1px);
        }
        h1, h2 {
            color: #74b9ff;  /* Light blue headers */
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        table {
            background-color: #353b48;
        }
        th {
            background-color: #2c3039;
            color: #74b9ff;
            padding: 12px;
            font-weight: 600;
        }
        td {
            padding: 10px;
            border: 1px solid #57606f;
            color: #f1f2f6;
        }
        a {
            color: #ffffff;  /* Changed from #74b9ff to white */
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: #e2e2e2;  /* Light grey on hover */
            text-decoration: underline;  /* Added underline on hover */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Company Details</h1>
    <!-- Input fields for Company Name and Project Name -->
    <div>
        <label for="companyName">Company Name (required):</label>
        <input type="text" id="companyName" required>
    </div>
    <div>
        <label for="projectName">Submission Project Name (optional):</label>
        <input type="text" id="projectName" placeholder="Defaults to Company Name if blank">
    </div>

    <h2>Measure your Cloud.Risk via inserting Cloud Vendor, Service, and Region Selection</h2>

    <!-- Buttons to add or remove pairs -->
    <div class="controls">
        <button onclick="addVariablePair()">+</button>
        <button onclick="removeVariablePair()">-</button>
    </div>

    <!-- Container to hold dynamically generated variable pairs -->
    <div id="variableContainer"></div>

</div>

<div class="container">
     <h2>Cloud.Risk</h2>


    <!-- Button to Submit Selected Values -->
    <button onclick="submitData()">Submit Data</button>

    <!-- Div to Display Submission Result -->
    <div id="result"></div>

    <!-- Link to Authorized users to see detailed results of your submission - Cloud.Risk.Graph your Measured Cloud.Risk RATIO -->
    <a href="https://workspace-preview.neo4j.io/workspace/query?ntid=google-oauth2%7C100793316574048247943">'Cloud.Risk.Graph - Measured Cloud.Risk RATIO for Cloud and Service pairs'</a>


    
</div>

<script>
    // Different options for each variable - Cloud and its Services

    const optionsForVariable1 = ["Amazon AWS", "Google Cloud GCP", "Microsoft Azure", "IBM Cloud", "Oracle Cloud OCI", "Snowflake", "Databricks", "Salesforce", "MongoDB", "Cloudflare", "Akamai", "Macrometa"];
    const optionsForVariable2 = ["AnyCast CloudFlare","CDN CloudFlare","CDN Akamai","Security Akamai","Edge Computing Akamai","CDN Macrometa","Edge Computing Macrometa",
        "Oracle AutonomousDB 21c","autonomousdb_21c","Object Storage OIC","Oracle_Big_Data_Service","Oracle Kubernetes Service (OKE)",
        "Azure SQL Managed Instance","Azure Cosmos DB","Azure Database for PostgreSQL","Azure Database for MySQL",
        "Azure Batch","Azure functions","Azure PowerBi App","Azure CDN","Azure Storage Accounts","Azure Kubernetes Service (AKS)",
        "IBM Dedicated Storage Instance","IBM Data Engine (previously SQL Query)","IBM Data Product Hub",
        "IBM Databases","IBM Databases for DataStax","IBM Databases for EDB",
        "IBM Databases for Elasticsearch","IBM Databases for etcd","IBM Databases for MongoDB",
        "IBM Databases for MySQL","IBM Databases for PostgreSQL","IBM Databases for Redis",
        "IBM DataStage","IBM Db2","IBM Db2 Warehouse","IBM watsonx BI Assistant",
        "IBM Dedicated Storage Instance","IBM Functions","IBM Cloud Object Storage","IBM Kubernetes",
        "Red Hat OpenShift on IBM Cloud",
        "Google Cloud VertexAI","Google Cloud Apigee","Google Cloud BigQuery","AlloyDB for PostgreSQL",
        "Google Cloud Dataproc","Google Cloud Dataflow","Google Cloud Storage","Google Cloud And Media CDN",
        "Google Kubernetes Engine (GKE)", 
        "Amazon API Gateway","Amazon Bedrock","Amazon CloudFront","Amazon CloudWatch Application Insights","Amazon CodeGuru Profiler","Amazon DataZone",
        "Amazon DocumentDB","Amazon DynamoDB","Amazon EC2 Instance Connect","Amazon Elastic Compute Cloud","Amazon Elastic Container Service",
        "Amazon Elastic File System","Amazon Elastic Load Balancing","Amazon Elastic MapReduce","Amazon ElastiCache",
        "Amazon EMR Serverless","Amazon FinSpace","Amazon QuickSight","Amazon AWS Lambda","Amazon AWS CloudFront",
        "Amazon AWS Step Functions","Amazon s3","Amazon Elastic Kubernetes Service",
        "Salesforce SaaS",
        "Snowflake on AWS","Snowflake on Azure","Snowflake on GCP",
        "MongoDB Atlas","MongoDB Atlas Search",
        "Databricks",
        "Salesforce SaaS",
    ];

    // Add new options for regions
    const optionsForVariable3 = ["global", "regional"];

    // Update variable tracking
    let trioCount = 4; // start with 4 trios
    const maxTrios = 85;

    // Function to create dropdown options for a given array of options
    function createDropdownOptions(options) {
        return options.map(option => `<option value="${option}">${option}</option>`).join("");
    }

    // Generate dropdown options
    const dropdownOptions1 = createDropdownOptions(optionsForVariable1);
    const dropdownOptions2 = createDropdownOptions(optionsForVariable2);
    const dropdownOptions3 = createDropdownOptions(optionsForVariable3);

    // Update functions to handle trios
    function addVariablePair() {
        if (trioCount < maxTrios) {
            trioCount++;
            renderVariableTrio(trioCount);
        } else {
            alert("Maximum number of trios reached.");
        }
    }

    function removeVariablePair() {
        if (trioCount > 1) {
            document.getElementById(`variableTrio_${trioCount}`).remove();
            trioCount--;
        } else {
            alert("Cannot have less than 1 trio.");
        }
    }

    // New function to render a variable trio
    function renderVariableTrio(trioNumber) {
        const container = document.getElementById("variableContainer");

        const variableTrioDiv = document.createElement("div");
        variableTrioDiv.className = "variable-pair"; // keep same class for styling
        variableTrioDiv.id = `variableTrio_${trioNumber}`;

        variableTrioDiv.innerHTML = `
            <label for="variable1_${trioNumber}">Set ${trioNumber} - Cloud Vendor:</label>
            <select id="variable1_${trioNumber}">
                <option value="">Select a vendor</option>
                ${dropdownOptions1}
            </select>

            <label for="variable2_${trioNumber}">Service:</label>
            <select id="variable2_${trioNumber}">
                <option value="">Select a service</option>
                ${dropdownOptions2}
            </select>

            <label for="variable3_${trioNumber}">Region:</label>
            <select id="variable3_${trioNumber}">
                <option value="">Select a region</option>
                ${dropdownOptions3}
            </select>
        `;

        container.appendChild(variableTrioDiv);
    }

    // Update initialization
    function initializeVariablePairs() {
        for (let i = 1; i <= trioCount; i++) {
            renderVariableTrio(i);
        }
    }

    // Update submit function to handle trios
    async function submitData() {
        const companyName = document.getElementById("companyName").value.trim();
        const projectName = document.getElementById("projectName").value.trim() || companyName;

        if (!companyName) {
            alert("Company Name is required.");
            return;
        }

        const data = {
            companyName: companyName,
            projectName: projectName,
            variableTrios: []
        };

        // Create table structure
        let tableHTML = `
            <table border="1" style="margin-top: 20px; width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th>Cloud Service</th>
                        <th>Global or by Region</th>
                        <th>Region</th>
                        <th>SLA Usage %</th>
                        <th>Traffic Coef %</th>
                        <th>SLA Deviation Risk Rating</th>
                        <th>Usage Risk Rating</th>
                        <th>Outage Time</th>
                        <th>Outage Remarks with GenAI</th>
                    </tr>
                </thead>
                <tbody>`;

        // Add explanation section
        const explanationHTML = `
            <div style="margin-top: 20px; padding: 15px; background-color: #2c3039; border-radius: 5px;">
                <h3 style="color: #74b9ff; margin-bottom: 10px;">Understanding the Risk Ratings:</h3>
                <ul style="list-style-type: none; padding-left: 0;">
                    <li style="margin-bottom: 8px;"><strong style="color: #74b9ff;">SLA Usage %:</strong> Measures the percentage of time the service is expected to be available based on the SLA</li>
                    <li style="margin-bottom: 8px;"><strong style="color: #74b9ff;">Traffic Coef %:</strong> Measures the percentage of time the service is expected to be available based on the SLA</li>
                    <li style="margin-bottom: 8px;"><strong style="color: #74b9ff;">SLA Deviation Risk Rating:</strong> Indicates Risk based on SLA discrepancies. Measures the likelihood of service level agreement deviations (0.0-999.0, where higher values indicate greater risk)</li>
                    <li style="margin-bottom: 8px;"><strong style="color: #74b9ff;">Usage Risk Rating:</strong> Indicates the operational risk based on service usage patterns (0.0-999.0, where higher values indicate greater risk)</li>
                    <li style="margin-bottom: 8px;"><strong style="color: #74b9ff;">Outage Remarks:</strong> AI-generated insights about potential service disruptions and historical performance</li>
                </ul>
            </div>`;

        // Update the loop to handle trios
        for (let i = 1; i <= trioCount; i++) {
            const variable1 = document.getElementById(`variable1_${i}`).value;
            const variable2 = document.getElementById(`variable2_${i}`).value;
            const variable3 = document.getElementById(`variable3_${i}`).value;

            if (variable1 && variable2 && variable3) {
                data.variableTrios.push({
                    set: i,
                    vendor: variable1,
                    service: variable2,
                    region: variable3
                });

                try {
                    const response = await fetch(
                        // CloudRiskAPI.InsureYourTech.Cloud
                        // `https://CloudRiskAPI.InsureYourTech.Cloud/cloud-services-risk-ratings/risk-ratings-freemium/freemium/fetch/service/service_name/${variable2}/global_or_by_regions/${variable3}`,
                        // Localhost
                        `http://localhost:8000/cloud-services-risk-ratings/risk-ratings-freemium/freemium/fetch/service/service_name/${variable2}/global_or_by_regions/${variable3}`,
                        {
                            method: 'GET',
                            headers: {
                                'Accept': 'application/json',
                                'Content-Type': 'application/json',
                            },
                            mode: 'cors',
                            credentials: 'same-origin',
                        }
                    );

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const riskData = await response.json();
                    
                    tableHTML += `
                        <tr>
                            <td>${variable2}</td>
                            <td>${variable3}</td>
                            <td>${riskData.region}</td>
                            <td>${riskData.service_sla_usage_percentage || 'N/A'}</td>
                            <td>${riskData.service_traffic_coef_by_percent_down || 'N/A'}</td>
                            <td>${riskData.sla_deviation_connected_risk_0_999|| 'N/A'}</td>
                            <td>${riskData.usage_connected_risk_0_999 || 'N/A'}</td>
                            <td>${riskData.annual_outage_time_days_hours_mins || 'N/A'}</td>
                            <td>${riskData.remarks_outage_genai || 'No details available'}</td>
                        </tr>`;
                } catch (error) {
                    console.error(`Error fetching data for ${variable2}:`, error);
                    tableHTML += `
                        <tr>
                            <td>${variable2}</td>
                            <td colspan="2">Error: ${error.message || 'Failed to fetch data'}</td>
                        </tr>`;
                }
            }
        }

        tableHTML += `
                </tbody>
            </table>`;

        // Display the results table
        document.getElementById("result").innerHTML = `
            <h3>Cloud.Risk Results:</h3>
            ${tableHTML}
            ${explanationHTML}`;
    }

    // Initialize the variable pairs on page load
    window.onload = initializeVariablePairs;
</script>

</body>
</html>
