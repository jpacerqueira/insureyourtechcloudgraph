
services:
  node-api:
    build:
      context: ./node-api
      dockerfile: node-js.Dockerfile
    container_name: node-api
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=dbusername
      - DB_PASSWORD=dbpassword
      - DB_NAME=cloud-insurance-risk-ratings
      - PORT=3000
    ports:
      - "3000:3000" # Expose API to port 3000
    depends_on:
      - postgres-db
    volumes:
      - ./node-postgres-api:/node-postgres-api
    working_dir: /app
    command: "npm start" # You can modify this if you're using a custom start script
  
  postgres-db:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_USER: dbusername
      POSTGRES_PASSWORD: dbpassword
      POSTGRES_DB: cloud-insurance-risk-ratings
    ports:
      - "5432:5432" # Expose DB to port 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  csv-loader:
    build:
      context: ./csv-loader
      dockerfile: csv-loader.Dockerfile
    container_name: csv-loader
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=dbusername
      - DB_PASSWORD=dbpassword
      - DB_NAME=cloud-insurance-risk-ratings
    volumes:
      - ./csv-loader:/csv-loader
      - ./data:/data
    working_dir: /app
    depends_on:
      - postgres-db
    networks:
      - backend
    command: ["node", "/app/data-loader.js", "/data/your_csv_file.csv"]

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge