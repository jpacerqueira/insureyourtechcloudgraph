services:

  ollama-llm:
    build:
      dockerfile: ollama.Dockerfile
    restart: unless-stopped
    volumes:
      - "./ollamadata:/root/.ollama"   # Persist data and models
    ports:
      - 11434:11434
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL_EXT-http://0.0.0.0:11434} # host.docker.internal:11434}
      - LLM=${LLM-llama3.2}
      # - FORCE_CUDA=1  # For GPU support if using CUDA-enabled machine
      # - PYTHONUNBUFFERED=1
      # - NVIDIA_VISIBLE_DEVICES=all  # If you have a GPU, uncomment this line for GPU access
  #  deploy:
  #    resources:
  #      limits:
  #        cpus: '16.00'  # Limit to 2 CPUs
  #        memory: 16g   # Limit memory to 8GB to prevent over-usage
  #      reservations:
  #        cpus: '4.0'  # Reserve 1 CPU core
  #        memory: 8g  # Reserve 4GB memory
  #  mem_limit: 16g         # Limit Docker container to 8GB of RAM (adjust as necessary)
  #  logging:
  #    driver: "json-file"
  #    options:
  #      max-file: "2"
  #      max-size: "100000m"
    healthcheck:
      test: ["CMD", "ollama", "list"]  # Check if Ollama is responding
      interval: 70s                    # Run the health check every 20 seconds
      timeout: 20s                     # Timeout for the health check is 30 seconds
      retries: 5                       # Retry 5 times before marking it as unhealthy
      start_period: 30s                # Wait 10 seconds before starting health checks
    networks:
      - net

  database:
    image: neo4j:5.25.1-community # 5.11
    ports:
      - 7687:7687
      - 7474:7474
    volumes:
      - $PWD/data:/data
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME-neo4j}/${NEO4J_PASSWORD-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_db_tx__log_rotation_retention__policy=false
    healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
        interval: 70s
        timeout: 10s
        retries: 5
    networks:
      - net
    depends_on:
      ollama-llm:
        condition: service_healthy

  pdf_bot_usebatch:
    build:
      dockerfile: pdf_bot_usebatch.Dockerfile
    environment:
      - NEO4J_URI=${NEO4J_URI-neo4j://database:7687}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD-password}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL-http://ollama-llm:11434} # host.docker.internal:11434}
      - LLM=${LLM-llama3.2}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL-sentence_transformer} # ollama} #
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT-"https://api.smith.langchain.com"}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
    volumes:
      - ./pdf_bot_usebatch:/app/pdf_bot_usebatch
    networks:
      - net
    depends_on:
      database:
        condition: service_healthy
      ollama-llm:
         condition: service_healthy
    x-develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - loader.py
            - bot.py
            - pdf_bot.py
    ports:
      - 8504:8504

networks:
  net:
