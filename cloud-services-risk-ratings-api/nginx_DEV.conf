x   
events {
    worker_connections 1024;
}

http {
    # Add global proxy settings
    proxy_buffer_size        128k;
    proxy_buffers            4 256k;
    proxy_busy_buffers_size  256k;
    proxy_temp_file_write_size 256k;
    proxy_read_timeout       120s;
    proxy_send_timeout       120s;
    client_header_timeout    120s;
    client_body_timeout      120s;

    server {
        listen 443 ssl;
        #server_name simulation-cloud-risk.insureyourtech.cloud; # PROD
        server_name simulation-cloud-risk.localhost; # DEV
        
        # SSL Configuration
        ssl_certificate /etc/nginx/certs/server8184.cert;
        ssl_certificate_key /etc/nginx/certs/server8184.key;

        location /simulation {
            proxy_pass https://cloud-risk-portal:8184;
        }
    }
    server {
        listen 443 ssl;
        #server_name api-cloud-risk.insureyourtech.cloud; # PROD
        server_name api-cloud-risk.localhost; # DEV

        # SSL Configuration
        ssl_certificate /etc/nginx/certs/server8183.cert;
        ssl_certificate_key /etc/nginx/certs/server8183.key;

        location /cloud-services-risk-ratings {
            proxy_pass https://node-api:8183;
        }
    }
    server {
        listen 443 ssl;
        #server_name customer-cloud-risk.insureyourtech.cloud; # PROD
        server_name customer-cloud-risk.localhost; # DEV

        # SSL Configuration
        ssl_certificate /etc/nginx/certs/cserver8184.cert;
        ssl_certificate_key /etc/nginx/certs/cserver8184.key;

        # Redirect all traffic to the login page if not authenticated
        location /customer-portal/ {
            proxy_pass https://cloud-risk-portal:8184;
            # Add logic to handle authentication redirection
            # This is typically handled by the application, not Nginx
        }
        location /customer-portal/login {
            proxy_pass https://cloud-risk-portal:8184;
        }
        location /customer-portal/register {
            proxy_pass https://cloud-risk-portal:8184;
        }
        location /customer-portal/index {
            proxy_pass https://cloud-risk-portal:8184;
        }
        location /customer-portal/logout {
            proxy_pass https://cloud-risk-portal:8184;
        }
        location /customer-portal/reset-password {
            proxy_pass https://cloud-risk-portal:8184;
        }
        location /customer-portal/reset-password-form {
            proxy_pass https://cloud-risk-portal:8184;
        }
        location /customer-portal/app/env {
            proxy_pass https://cloud-risk-portal:8184;
        }
    }
    #server {
    #    listen 8185 ssl;
    #    #server_name app-cloud-risk.insureyourtech.cloud; # PROD
    #    server_name app-cloud-risk.localhost; # DEV

    #    # SSL Configuration
    #    ssl_certificate /etc/nginx/certs/server8185.cert;
    #    ssl_certificate_key /etc/nginx/certs/server8185.key;

    #    location /customer_portal_app/ {  
    #        proxy_pass https://customer_portal_app:8185;
    #    }
    #}
    server {
        listen 443 ssl;
        #server_name services-app-cloud-risk.insureyourtech.cloud; # PROD
        server_name services-app-cloud-risk.localhost; # DEV

        # SSL Configuration
        ssl_certificate /etc/nginx/certs/server8186.cert;
        ssl_certificate_key /etc/nginx/certs/server8186.key;

        location /cloud-services-app {
            proxy_pass http://services-app:8186/cloud-services-app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase Proxy Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Serve static assets directly
        location /static/ {
            alias /app/build/static/;
            expires max;
            add_header Cache-Control public;
            access_log off;
        }

        # Optional: Serve other static files if necessary
        location /favicon.ico {
            alias /app/build/favicon.ico;
            expires max;
            add_header Cache-Control public;
            access_log off;
        }

        # Ensure API requests are handled by Express directly
        location /api/ {
            proxy_pass http://services-app:8186/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}