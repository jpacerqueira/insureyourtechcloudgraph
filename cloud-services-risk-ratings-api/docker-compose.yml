services:
  
  postgres-db:
    image: postgres:16.4
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: xx_cloud_service_risk_ratings
    ports:
      - "5432:5432" # Expose DB to port 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./create-cloud-service-risk-ratings-db.sql:/docker-entrypoint-initdb.d/create_database.sql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER" ]
      interval: 20s
      timeout: 4s
      retries: 2

  node-api:
    build:
      context: ./node-api
      dockerfile: node-js.Dockerfile
    container_name: node-api
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=cloud_service_risk_ratings
      - PORT=8000
    ports:
      - "8000:8000" # Expose API to port 8000
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ./node-api:/node-api
    working_dir: /app
    networks:
      - backend
    command: "npm start" # You can modify this if you're using a custom start script
    restart: unless-stopped


  csv-loader:
    build:
      context: ./csv-loader
      dockerfile: csv-loader.Dockerfile
    container_name: csv-loader
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=cloud_service_risk_ratings
    volumes:
      - ./csv-loader:/csv-loader
      - ./data:/data
    working_dir: /app
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - backend
    command: >
      sh -c "node /app/data-loader.js 
      /data/cloud_service_risk_ratings.csv service_risk_ratings
      /data/outage_report_summaries.csv outage_report_summaries"

outage-workbench-loader:
    build:
      context: ./outage-workbench-loader:
      dockerfile: outage-workbench-loader.Dockerfile
    container_name: outage-workbench-loader:
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=cloud_service_risk_ratings
    volumes:
      - ./outage-workbench-loader:/outage-workbench-loader
      - ./data:/data
    working_dir: /app
    depends_on:
      postgres-db:
        condition: service_healthy
      csv-loader:
        condition: service_finished
    networks:
      - backend
    command: >
      sh -c "node /app/outage-data-loader.js"

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge